<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arquivo - O Cavalheiro Moderno</title>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&… rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="styles.css">
<style>
        /* Estilos específicos para a página Arquivo */
        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
        }
        .search-area input {
            flex-grow: 1;
            padding: 12px;
            border: 1px solid #AAAAAA;
            border-radius: 4px;
            font-size: 1em;
        }
        .search-area button {
            background-color: #0A1931;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        .tag-cloud { text-align: center; margin-bottom: 40px; }
        .tag-cloud button { /* Botões de Filtro/Tag */
            background-color: #EEEEEE;
            border: none;
            color: #333333;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        .tag-cloud button.active, .tag-cloud button:hover {
            background-color: #0A1931;
            color: #FFFFFF;
        }
 
        .artigos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
 
        .artigo-card {
            background-color: #FFFFFF;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            text-decoration: none;
            color: #333333;
            transition: transform 0.3s;
        }
        .artigo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
        }
        .artigo-card-img { 
            width: 100%; 
            height: 200px; 
            background-color: #DDD; /* Placeholder */
            object-fit: cover;
        }
        .artigo-card-content { padding: 20px; }
        .artigo-card-content h3 { font-size: 1.3em; margin-bottom: 10px; }
        .artigo-card-content small { color: #AAAAAA; display: block; margin-bottom: 10px; }
</style>
</head>
<body>
<header id="main-header">
<div class="logo">O CAVALHEIRO MODERNO</div>
<nav class="desktop-menu">
<a href="index.html">HOME</a>
<a href="estilos.html">ESTILOS</a>
<a href="guia.html">GUIA DE COMPRAS</a>
<a href="arquivo.html" class="active">ARQUIVO</a>
</nav>
<button class="hamburger" aria-label="Menu" id="hamburger-btn"><i class="fas fa-bars"></i></button>
</header>
 
    <main style="padding-top: 100px;">
<div class="container">
<h1>Arquivo: Conhecimento Essencial e Dicas de Ouro.</h1>
 
            <div class="search-area">
<input type="text" id="search-input" placeholder="Buscar por tema ou palavra-chave...">
<button id="search-btn"><i class="fas fa-search"></i></button>
</div>
 
            <div class="tag-cloud">
<button data-tag="all" class="active">VER TUDO</button>
<button data-tag="acessorios">ACESSÓRIOS</button>
<button data-tag="tenis">TÊNIS</button>
<button data-tag="alfaiataria">ALFAIATARIA</button>
<button data-tag="cuidados">CUIDADOS</button>
<button data-tag="historia">HISTÓRIA DA MODA</button>
</div>
 
            <div class="artigos-grid" id="artigos-list">
<a href="artigo-exemplo.html" class="artigo-card" data-tags="acessorios cuidados">
<div class="artigo-card-img" style="background-image: url('placeholder-acessorio.jpg');"></div>
<div class="artigo-card-content">
<small>Publicado em 10/10/2025</small>
<h3>Guia de Relógios: O Único Acessório Necessário.</h3>
<p>Aprenda a escolher, usar e cuidar do seu relógio, um ícone de status e elegância.</p>
<button class="cta-button" style="padding: 10px 15px; font-size: 0.9em; margin-top: 10px;">LEIA O ARTIGO</button>
</div>
</a>
</div>
 
        </div>
</main>
<script src="script.js"></script>
<script>
        // Lógica JavaScript Específica para Filtros de Arquivo
        const articles = document.querySelectorAll('.artigo-card');
        const filterButtons = document.querySelectorAll('.tag-cloud button');
 
        filterButtons.forEach(button => {
            button.addEventListener('click', function() {
                // 1. Atualiza o estado dos botões
                filterButtons.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
 
                const filterTag = this.getAttribute('data-tag');
 
                // 2. Filtra os artigos
                articles.forEach(article => {
                    const articleTags = article.getAttribute('data-tags');
                    if (filterTag === 'all' || articleTags.includes(filterTag)) {
                        article.style.display = 'block';
                    } else {
                        article.style.display = 'none';
                    }
                });
            });
        });
        // (A lógica de Pesquisa com a Lupa seria um exercício similar de JS, mas focando no texto do título/resumo.)
</script>
</body>
</html>
